# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
    tags: ['v*']
  pull_request:
    branches: [ "main" ]

jobs:

  # ------------ Build and Test ------------
  build:
    runs-on: ubuntu-latest
    defaults: 
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum

    - name: Install dependencies
      run: |
        go get .

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...


  # ------------ Release -------------
  release: 
    needs: build                              # nur wenn build + test grün sind
    if: startsWith(github.ref, 'refs/tags/v') # nur bei Tags
    runs-on: ubuntu-latest
    permissions: 
      contents: write                         # nur dieser Job darf schreiben

    steps:
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0                      # ganze Historie fürs Changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with: 
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with: 
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
          workdir: backend
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

